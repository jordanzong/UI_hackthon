name: Remove Redundant Unmarked SPHEREx GIFs
on:
  workflow_dispatch:
  push:
    branches:
      - feature/science-analysis-runs
    paths:
      - tools/dedupe_marked_gifs.py
      - .github/workflows/dedupe-marked-gifs.yml
permissions:
  contents: write
concurrency:
  group: dedupe-spherex-marked-gifs
  cancel-in-progress: false
jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image library
        run: python3 -m pip install "Pillow>=10"
      - name: Test on synthetic GIF pairs
        run: python3 tools/test_dedupe_marked_gifs.py
      - name: Validate complete science inventory before deleting
        run: python3 tools/dedupe_marked_gifs.py --science-dir science-runs
      - name: Remove only verified redundant originals
        run: python3 tools/dedupe_marked_gifs.py --science-dir science-runs --apply
      - name: Check every remaining science asset is reachable
        run: python3 tools/test_ui_consolidation.py
      - name: Commit verified deletions without overwriting newer work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u science-runs/
          if git diff --cached --quiet; then
            echo "All old GIFs already removed"
          else
            git commit -m "chore(data): retire redundant original GIFs after frame verification"
            git fetch origin feature/science-analysis-runs
            git rebase FETCH_HEAD
            git push origin HEAD:feature/science-analysis-runs
          fi
