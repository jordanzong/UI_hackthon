<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="sky-atlas-release" content="SPHEREX-MARKED-GIFS-FOV-0.2-20261115">
<title>天球星圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Mission-control look: deep blue-black, hairline rules, square corners, wide-tracked uppercase labels.
   Colour carries hierarchy: white = objects, steel blue = structure, teal = deep-sky, amber = what you act on. */
:root{
  --bg:#05070d;
  --surface:#080c15;
  --on:#05070d;
  --fg:#e8eef9;
  --muted:#8a97ae;
  --line:rgba(150,175,215,.32);
  --line-soft:rgba(150,175,215,.15);
  --accent:#ffb454;
  --bad:#ff7a6b;
  --panel:rgba(5,8,15,.84);
  --top:56px;
  --rail:352px;
  --font:'Barlow','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;background:var(--bg)}
body{color:var(--fg);font:14px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;margin:0}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---- top bar ---- */
#top{flex:none;height:var(--top);display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line-soft);position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{flex:none;width:20px;height:20px;color:var(--accent)}
.brand h1{margin:0;font:600 14px/1 var(--font);letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
.brand-sep{flex:none;width:1px;height:16px;background:var(--line)}
.brand-sub{font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:10px;flex:none}

/* ---- buttons ---- */
.btn{appearance:none;-webkit-appearance:none;font:600 11px/1 var(--font);letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;text-align:center;
  color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:0;padding:13px 16px;cursor:pointer;white-space:nowrap;
  transition:background-color .18s,color .18s,border-color .18s}
.btn:hover{background:var(--fg);color:var(--on);border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.primary:hover{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:9px 12px;font-size:10.5px}
.btn:focus-visible,summary:focus-visible,.chips button:focus-visible,#zoomkeys button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

/* ---- layout ---- */
#main{flex:1;min-height:0;display:flex;position:relative}
#panel{flex:none;width:var(--rail);min-height:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line-soft);counter-reset:sec}
#panel[data-collapsed="true"]{display:none}
#pbody{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:26px;
  padding:24px 20px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));
  scrollbar-width:thin;scrollbar-color:rgba(150,175,215,.28) transparent}
#pbody::-webkit-scrollbar{width:6px}
#pbody::-webkit-scrollbar-thumb{background:rgba(150,175,215,.28)}
#stage{flex:1;min-width:0;position:relative;background:var(--bg)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:var(--bg)}
#sky.grabbing{cursor:grabbing}
#sky:focus-visible{outline:1px solid var(--line);outline-offset:-1px}
#ui{position:absolute;inset:0;pointer-events:none}

/* ---- panel sections ---- */
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec+.sec{border-top:1px solid var(--line-soft);padding-top:24px}
.sec>h2,summary{margin:0;font:500 10.5px/1.2 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sec>h2::before,.sec>details>summary::before{counter-increment:sec;content:counter(sec,decimal-leading-zero) "\00a0\00a0—\00a0\00a0";font-family:var(--mono);letter-spacing:.06em;color:var(--accent)}
summary{cursor:pointer;list-style:none;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:9px;height:9px;
  background:linear-gradient(currentColor,currentColor) center/100% 1px no-repeat,linear-gradient(currentColor,currentColor) center/1px 100% no-repeat}
details[open]>summary::after{background:linear-gradient(currentColor,currentColor) center/100% 1px no-repeat}
details[open]>summary{margin-bottom:14px}
summary:hover{color:var(--fg)}

/* ---- form ---- */
form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field>span{font:500 10.5px/1.4 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:14px;min-width:0;align-items:flex-end}
.row>*{min-width:0}
input[type=text],select{font:400 14px/1.3 var(--mono);color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:9px 0;width:100%;
  transition:border-color .15s,box-shadow .15s}
input[type=text]::placeholder{color:rgba(138,151,174,.5)}
input[type=text]:hover,select:hover{border-bottom-color:rgba(150,175,215,.65)}
input[type=text]:focus,select:focus{outline:0;border-bottom-color:var(--accent);box-shadow:0 1px 0 0 var(--accent)}
select{appearance:none;-webkit-appearance:none;width:auto;flex:0 0 auto;min-width:64px;padding-right:18px;font-family:var(--font);font-size:13px;cursor:pointer;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23f0f0fa' stroke-width='1.2'/></svg>") right 2px center/9px 6px no-repeat}
select option{background:#080c15;color:var(--fg)}
input[aria-invalid="true"]{border-bottom-color:var(--bad);box-shadow:0 1px 0 0 var(--bad)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
#msg{margin:0;min-height:1.5em;font:400 11.5px/1.5 var(--mono);color:var(--muted)}
#msg.err{color:var(--bad)}

/* ---- presets / layers ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{appearance:none;font:500 12px/1 var(--font);letter-spacing:.06em;color:var(--fg);background:transparent;border:1px solid var(--line-soft);border-radius:0;padding:9px 11px;cursor:pointer;
  transition:background-color .15s,color .15s,border-color .15s}
.chips button:hover{background:var(--fg);color:var(--on);border-color:var(--fg)}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.layers label{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer}
.layers input{appearance:none;-webkit-appearance:none;flex:none;width:14px;height:14px;margin:0;border:1px solid var(--line);border-radius:0;background:transparent;cursor:pointer;display:grid;place-items:center;transition:background-color .15s,border-color .15s}
.layers input:hover{border-color:var(--fg)}
.layers input:checked{background:var(--fg);border-color:var(--fg)}
.layers input:checked::after{content:"";width:7px;height:4px;border-left:1.5px solid var(--on);border-bottom:1.5px solid var(--on);transform:translateY(-1px) rotate(-45deg)}
.layers input:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

/* ---- selection card ---- */
#sel dl{display:grid;grid-template-columns:auto 1fr;margin:0}
#sel dt,#sel dd{padding:8px 0;border-top:1px solid var(--line-soft)}
#sel dt{font:500 10.5px/1.7 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-right:16px}
#sel dd{margin:0;font:400 12.5px/1.5 var(--mono);text-align:right;overflow-wrap:anywhere}
#sel dd .sub{display:block;color:var(--muted);font-size:11.5px}
#sel .name{margin:0 0 10px;font:600 15px/1.35 var(--font);letter-spacing:.06em}
#sel .name .meta{color:var(--muted);font-weight:400;font-size:12px;letter-spacing:.04em}
#sel .none{margin:0;color:var(--muted);font-size:13px}
#sel .btns{margin-top:12px}
.fine{margin:0;font-size:11px;line-height:1.65;color:var(--muted)}

/* ---- zoom keys + telemetry bar ---- */
#zoomkeys{position:absolute;pointer-events:auto;top:50%;transform:translateY(-50%);right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
#zoomkeys button{appearance:none;width:40px;height:40px;padding:0;font:300 22px/1 var(--font);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:0;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background-color .15s,color .15s}
#zoomkeys button+button{margin-top:-1px}
#zoomkeys button:hover{background:var(--fg);color:var(--on)}
#bar{position:absolute;left:0;right:0;bottom:0;pointer-events:none;display:flex;flex-wrap:wrap;align-items:stretch;
  background:var(--panel);border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#bar .cell{display:flex;flex-direction:column;gap:5px;padding:10px 20px 11px;border-left:1px solid var(--line-soft);min-width:0}
#bar .cell:first-child{border-left:0}
#bar .lab{font:500 10px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
#bar .val{font:400 12px/1.4 var(--mono);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .hint{margin-left:auto;align-self:center;padding:0 20px;font:400 11px/1.4 var(--font);letter-spacing:.12em;color:var(--muted)}

@media (max-width:720px){
  .brand-sub,.brand-sep{display:none}
  .brand h1{letter-spacing:.26em}
  #panel{position:absolute;z-index:6;left:0;right:0;top:0;width:auto;max-height:78%;border-right:0;border-bottom:1px solid var(--line);background:rgba(8,12,21,.96)}
  #pbody{padding-right:max(20px,env(safe-area-inset-right,0px))}
  #bar .hint{display:none}
  #bar .cell{flex:1 1 auto;padding:8px 14px 9px}
}
@media (hover:none){#bar .cell.hovcell{display:none}}
@media (pointer:coarse){input[type=text],select{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Sky Atlas FOV range: 0.2°–180° (12 arcmin minimum). */
#fov-range{display:block;color:var(--muted);font:10px/1.4 var(--mono);margin-top:4px}

#allSkyCatalogStatus,#gaiaWideStatus{color:var(--fg);font:11px/1.55 var(--mono);overflow-wrap:anywhere}
#allSkyRetry{align-self:flex-start;font:500 10px/1.4 var(--font);letter-spacing:.03em;padding:7px 12px;text-indent:0}
#science-catalogs .allsky-license{margin:0;color:var(--muted);font:10px/1.6 var(--font)}
#science-catalogs .allsky-license a{color:var(--accent);text-decoration:underline}
.hyg-release{font:500 9px/1.4 var(--mono);color:var(--accent);border:1px solid var(--line);padding:4px 6px;letter-spacing:.05em;white-space:nowrap}
@media(max-width:850px){.hyg-release{display:none}}
/* Science extensions: keep the uploaded mission-control design and original control IDs. */
.catalog-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.catalog-tools .btn{min-width:0;white-space:normal;line-height:1.35;min-height:36px;letter-spacing:.04em;text-indent:0;padding:9px 7px}
.catalog-tools #importSources{grid-column:span 2}
#catalogStatus{font:11px/1.6 var(--mono);color:var(--muted);overflow-wrap:anywhere;margin:0;min-height:1.5em}
#catalogStatus.warn{color:var(--bad)}
#science-catalogs .catalog-error-details{margin:0;color:var(--bad);
  font:11px/1.6 var(--mono);overflow-wrap:anywhere;
  border-left:2px solid var(--bad);padding:3px 0 3px 10px}
#science-catalogs .catalog-error-details[hidden]{display:none}
#science-catalogs{gap:12px}
#science-catalogs .catalog-description{margin:0;color:var(--muted);font:11px/1.65 var(--font)}
#science-catalogs .gaia-cache-tools{display:flex;flex-direction:column;gap:7px;
 border-top:1px solid var(--line-soft);padding-top:12px}
#science-catalogs .gaia-cache-tools label{font:500 10px/1.4 var(--font);letter-spacing:.1em;color:var(--muted)}
#science-catalogs .gaia-cache-actions{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:7px}
#science-catalogs #gaiaCacheTarget{width:100%;min-width:0;background:var(--surface);
 color:var(--fg);border:1px solid var(--line);border-radius:0;
 padding:8px;font:11px/1.4 var(--font)}
#science-catalogs #gaiaCacheGo{min-width:0;padding:9px 5px;font-size:10px;letter-spacing:0;text-indent:0}
#science-catalogs #gaiaCacheStatus{margin:0;color:var(--muted);font:11px/1.5 var(--mono);overflow-wrap:anywhere}
#science-catalogs .catalog-reload{align-self:flex-start;min-width:152px}
#science-catalogs .catalog-advanced{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:3px}
#science-catalogs .catalog-advanced>summary{font-size:10px;letter-spacing:.08em}
#science-catalogs .catalog-advanced>summary::before{content:none;counter-increment:none}
#science-catalogs .catalog-advanced .catalog-tools{margin-top:9px;grid-template-columns:1fr 1fr;gap:7px}
#science-catalogs .catalog-advanced .catalog-tools #importSources{grid-column:auto}
#sel h2{margin:0;font:500 10.5px/1.2 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
#sel .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#sel .sel-actions .btn{width:100%;min-width:0;white-space:normal;text-indent:0;letter-spacing:.08em;padding:12px 8px}
#sel .sel-actions .btn.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}
#sel .sel-actions .btn.primary:hover{background:transparent;color:var(--accent)}
#sel .sel-actions .btn:not(.primary){background:transparent;color:var(--fg);border-color:var(--line)}
#sel .sel-actions .btn:not(.primary):hover{background:var(--fg);color:var(--on)}
#pbody button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
#bar .val{font-variant-numeric:tabular-nums}
#top .top-actions{align-items:center}
#top .btn.sm{font-size:10px}
@media(max-width:720px){
  #panel[data-collapsed="true"]{display:none}
  .top-actions{gap:5px}
  #top{padding-left:12px;padding-right:12px}
  #top .btn.sm{padding:9px 7px;letter-spacing:.06em;text-indent:0}
  #pbody{gap:20px}
}
@media(max-width:410px){
  .brand h1{font-size:12px;letter-spacing:.16em}
  .brand{gap:5px}
  #top .top-actions{gap:4px}
}
/* Coordinate controls and selection details share a single numbered section. */
#sel.selection-inline{border-top:1px solid var(--line-soft);padding-top:15px;margin-top:2px;min-height:30px}
#sel.selection-inline h2{color:var(--accent)}
#preset-staging[hidden]{display:none}
</style>
<link rel="stylesheet" href="./spherex-viewer.css?v=4">
<link rel="stylesheet" href="./science-run-browser.css?v=8">
<link rel="stylesheet" href="./sky-map-tools.css?v=3">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 0v5M10 15v5M0 10h5M15 10h5"/></svg>
      <h1 data-i18n="title">天球星圖</h1>
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-sub" data-i18n="sub">J2000 · 赤道座標</span>
      <span class="hyg-release" title="HYG retry and Gaia wide-field build">HYG + Gaia · v2</span>
    </div>
    <div class="top-actions">
      <button type="button" class="btn sm" id="lang" aria-label="Language / 語言">EN</button>
      <button type="button" class="btn sm" id="collapse" aria-expanded="true" aria-controls="panel">收合面板</button>
    </div>
  </header>

  <div id="main">
    <aside id="panel" data-collapsed="false" aria-label="控制面板" data-i18n-aria="panelAria">
      <div id="pbody">
        <div class="sec">
          <h2 data-i18n="goto">前往座標</h2>
          <form id="goto" autocomplete="off" novalidate>
            <label class="field"><span data-i18n="ra">赤經 RA</span>
              <div class="row"><input type="text" id="ra" placeholder="05h 35m 17s 或 83.82" data-i18n-ph="phRA" spellcheck="false">
              <select id="raUnit" aria-label="赤經單位" data-i18n-aria="raUnitAria"><option value="auto" data-i18n="auto">自動</option><option value="h" data-i18n="hours">時</option><option value="d" data-i18n="degs">度</option></select></div></label>
            <label class="field"><span data-i18n="dec">赤緯 Dec</span>
              <input type="text" id="dec" placeholder="−05° 23′ 28″ 或 -5.39" data-i18n-ph="phDec" spellcheck="false"></label>
            <label class="field"><span data-i18n="fov">天區大小 FOV（畫面短邊的視角）</span>
              <div class="row"><input type="text" id="fov" value="60" inputmode="decimal" aria-describedby="fov-range" spellcheck="false">
              <select id="unit" aria-label="視場單位" data-i18n-aria="unitAria"><option value="1">°</option></select></div>
              <small id="fov-range">FOV：0.2°–180°（最小 12′）</small></label>
            <div class="btns"><button class="btn primary" type="submit" data-i18n="go">前往</button><button type="button" class="btn" id="readc" data-i18n="readc">讀取畫面中心</button></div>
            <p id="msg" role="status"></p>
          </form>
          <div id="sel" class="selection-inline" aria-live="polite"></div>
        </div>
        <div id="preset-staging" hidden><details><summary data-i18n="presets">預設目標</summary><div class="chips" id="presets"></div></details></div>
        <div class="sec"><details open><summary data-i18n="layers">圖層</summary><div class="layers" id="layers"></div></details></div>
        <div class="sec" id="science-catalogs">
          <h2 data-i18n="additionalCatalogs">自動星表 / 科學資料</h2>
          <p class="catalog-description" data-i18n="gaiaAutoDesc">Gaia DR3 於視野縮至 12° 內時自動查詢。</p>
          <p class="catalog-description" data-i18n="spxAutoDesc">SPHEREx Source Catalog 隨研究目標自動讀取，尚無已驗證資料的目標不顯示來源。</p>
          <button class="btn sm catalog-reload" type="button" id="reloadGaia" data-i18n="reloadGaia">重新查詢 Gaia</button>
          <p id="catalogStatus" role="status" aria-live="polite"></p>
          <div class="gaia-cache-tools">
            <label for="gaiaCacheTarget" data-i18n="gaiaCacheJump">Gaia CSV：前往已快取天區</label>
            <div class="gaia-cache-actions">
              <select id="gaiaCacheTarget" aria-label="Gaia cached science field" disabled><option value="">載入資料清單中…</option></select>
              <button type="button" class="btn sm" id="gaiaCacheGo" disabled data-i18n="gaiaCacheGo">前往</button>
            </div>
            <p id="gaiaCacheStatus" role="status" aria-live="polite"></p>
            <p id="allSkyCatalogStatus" role="status" aria-live="polite">HYG 全天星表載入中…</p>
            <button type="button" class="btn sm" id="allSkyRetry" data-i18n="retryHYG">重新載入 HYG 分區</button>
            <p id="gaiaWideStatus" role="status" aria-live="polite">擴大版 Gaia 天區載入中…</p>
            <p class="allsky-license">全天基礎恆星：<a href="https://github.com/astronexus/HYG-Database" target="_blank" rel="noopener noreferrer">HYG v4.1</a> · V 星等 · CC BY-SA 4.0。Gaia DR3 資料會獨立顯示。</p>
          </div>
          <p id="gaiaErrorDetails" class="catalog-error-details" role="status" aria-live="polite" hidden></p>
          <details class="catalog-advanced">
            <summary data-i18n="catalogAdvanced">進階：匯入自訂星表（開發測試）</summary>
            <div class="catalog-tools">
              <button class="btn sm" type="button" id="importGaia" data-i18n="importGaia">匯入 Gaia CSV</button>
              <input id="gaiaFile" type="file" accept=".csv,text/csv" hidden>
              <button class="btn sm" type="button" id="importSources" data-i18n="importSources">匯入 SPHEREx CSV / JSON</button>
              <input id="sourceFile" type="file" accept=".csv,.ecsv,.json,text/csv,application/json" hidden>
            </div>
          </details>
        </div>
        <p class="fine" id="catnote"></p>
      </div>
    </aside>

    <main id="stage">
      <canvas id="sky" aria-label="天球星圖，可拖曳平移、滾輪縮放、點擊選取座標" data-i18n-aria="canvasAria" tabindex="0"></canvas>
      <div id="ui">

<script>
//<core>
const D2R=Math.PI/180,R2D=180/Math.PI,TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const norm360=d=>((d%360)+360)%360;
const normRad=r=>((r%TAU)+TAU)%TAU;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const pad=(n,w=2)=>String(n).padStart(w,'0');

/* ---- view + stereographic projection (north up, east left) ---- */
const V={ra:0,dec:0,fov:60,sd:0,cd:1,S:1,cx:0,cy:0,W:0,H:0};
function updateScale(){const R=Math.min(V.W,V.H)||1;V.S=(R/2)/(2*Math.tan(V.fov*D2R/4));}
function setSize(W,H){V.W=W;V.H=H;V.cx=W/2;V.cy=H/2;updateScale();}
function setView(ra,dec,fov){
  V.ra=normRad(ra);V.dec=clamp(dec,-1.5707953,1.5707953);V.fov=clamp(fov,0.2,180);
  V.sd=Math.sin(V.dec);V.cd=Math.cos(V.dec);updateScale();
}
function project(ra,dec,o){
  const dra=ra-V.ra,cd=Math.cos(dec),sd=Math.sin(dec),cdr=Math.cos(dra);
  const cosc=V.sd*sd+V.cd*cd*cdr;
  if(cosc<-0.995)return false;
  const k=2/(1+cosc);
  o.x=V.cx-k*cd*Math.sin(dra)*V.S;
  o.y=V.cy-k*(V.cd*sd-V.sd*cd*cdr)*V.S;
  o.k=k;
  return true;
}
function unproject(px,py){
  const x=(V.cx-px)/V.S,y=(V.cy-py)/V.S,rho=Math.hypot(x,y);
  if(rho<1e-14)return{ra:V.ra,dec:V.dec};
  const c=2*Math.atan(rho/2),sc=Math.sin(c),cc=Math.cos(c);
  const dec=Math.asin(clamp(cc*V.sd+y*sc*V.cd/rho,-1,1));
  const ra=V.ra+Math.atan2(x*sc,rho*V.cd*cc-y*V.sd*sc);
  return{ra:normRad(ra),dec};
}
function anchorTo(sky,px,py){
  for(let i=0;i<10;i++){
    const c=unproject(px,py);
    const dr=angDiff(sky.ra,c.ra),dd=sky.dec-c.dec;
    if(Math.abs(dr)+Math.abs(dd)<1e-11)break;
    setView(V.ra+dr,V.dec+dd,V.fov);
  }
}
function sep(a1,d1,a2,d2){return Math.acos(clamp(Math.sin(d1)*Math.sin(d2)+Math.cos(d1)*Math.cos(d2)*Math.cos(a1-a2),-1,1));}

/* ---- galactic <-> equatorial (J2000 rotation matrix) ---- */
const GM=[[-0.0548755604,-0.8734370902,-0.4838350155],[0.4941094279,-0.4448296300,0.7469822445],[-0.8676661490,-0.1980763734,0.4559837762]];
function galToEq(l,b){
  const x=Math.cos(b)*Math.cos(l),y=Math.cos(b)*Math.sin(l),z=Math.sin(b);
  const ex=GM[0][0]*x+GM[1][0]*y+GM[2][0]*z,ey=GM[0][1]*x+GM[1][1]*y+GM[2][1]*z,ez=GM[0][2]*x+GM[1][2]*y+GM[2][2]*z;
  return{ra:normRad(Math.atan2(ey,ex)),dec:Math.asin(clamp(ez,-1,1))};
}
function eqToGal(ra,dec){
  const x=Math.cos(dec)*Math.cos(ra),y=Math.cos(dec)*Math.sin(ra),z=Math.sin(dec);
  const gx=GM[0][0]*x+GM[0][1]*y+GM[0][2]*z,gy=GM[1][0]*x+GM[1][1]*y+GM[1][2]*z,gz=GM[2][0]*x+GM[2][1]*y+GM[2][2]*z;
  return{l:normRad(Math.atan2(gy,gx)),b:Math.asin(clamp(gz,-1,1))};
}

/* ---- parsing user input ---- */
function nums(s){const m=s.match(/\d+(?:\.\d+)?|\.\d+/g);return m?m.map(Number):[];}
function cleanStr(s){return String(s).trim().toLowerCase().replace(/[−–—]/g,'-').replace(/,/g,'.');}
function parseRA(str,unit){
  const s=cleanStr(str);if(!s)return NaN;
  const n=nums(s);if(!n.length||n.length>3)return NaN;
  if(n.length>1&&(n[1]>=60||(n[2]||0)>=60))return NaN;
  const val=n[0]+(n[1]||0)/60+(n[2]||0)/3600;
  let hours;
  if(unit==='h')hours=true;
  else if(unit==='d')hours=false;
  else if(/h/.test(s))hours=true;
  else if(/[°d]/.test(s))hours=false;
  else hours=/:/.test(s)||n.length>=2;
  const deg=hours?val*15:val;
  if(!isFinite(deg)||deg>360)return NaN;
  return /^-/.test(s)?norm360(-deg):norm360(deg);
}
function parseDec(str){
  const s=cleanStr(str);if(!s)return NaN;
  const n=nums(s);if(!n.length||n.length>3)return NaN;
  if(n.length>1&&(n[1]>=60||(n[2]||0)>=60))return NaN;
  const val=n[0]+(n[1]||0)/60+(n[2]||0)/3600;
  if(!isFinite(val)||val>90)return NaN;
  return /^-/.test(s)?-val:val;
}
function parseFov(str,unitDiv){
  const s=cleanStr(str);const n=nums(s);if(n.length!==1)return NaN;
  const deg=n[0]/unitDiv;
  return(deg>=0.2&&deg<=180)?deg:NaN;
}

/* ---- formatting ---- */
function fmtHMS(raDeg,prec){
  const f=Math.pow(10,prec);let t=norm360(raDeg)/15*3600;t=Math.round(t*f)/f;if(t>=86400)t-=86400;
  const h=Math.floor(t/3600),m=Math.floor((t-h*3600)/60),s=t-h*3600-m*60;
  return pad(h)+'h '+pad(m)+'m '+s.toFixed(prec).padStart(prec?3+prec:2,'0')+'s';
}
function fmtDMS(dec,prec){
  const f=Math.pow(10,prec),sg=dec<0?'−':'+';let t=Math.round(Math.abs(dec)*3600*f)/f;
  const d=Math.floor(t/3600),m=Math.floor((t-d*3600)/60),s=t-d*3600-m*60;
  return sg+pad(d)+'° '+pad(m)+'′ '+s.toFixed(prec).padStart(prec?3+prec:2,'0')+'″';
}
function labRA(raDeg,stepDeg){
  const stepS=stepDeg/15*3600;let t=Math.round(norm360(raDeg)/15*3600*1000)/1000;if(t>=86400)t-=86400;
  const h=Math.floor(t/3600+1e-9);if(stepS>=3600-1e-6)return h+'h';
  const m=Math.floor((t-h*3600)/60+1e-9);if(stepS>=60-1e-6)return h+'h '+pad(m)+'m';
  const s=t-h*3600-m*60;return h+'h '+pad(m)+'m '+s.toFixed(stepS>=1?0:stepS>=0.1?1:2)+'s';
}
function labDec(dec,stepDeg){
  const stepA=stepDeg*3600,sg=dec<0?'−':dec>0?'+':'';const t=Math.round(Math.abs(dec)*3600*1000)/1000;
  const d=Math.floor(t/3600+1e-9);if(stepA>=3600-1e-6)return sg+d+'°';
  const m=Math.floor((t-d*3600)/60+1e-9);if(stepA>=60-1e-6)return sg+d+'° '+pad(m)+'′';
  const s=t-d*3600-m*60;return sg+d+'° '+pad(m)+'′ '+s.toFixed(stepA>=1?0:stepA>=0.1?1:2)+'″';
}
function fmtAng(deg){
  if(deg>=1)return deg.toFixed(deg>=10?1:2)+'°';
  if(deg>=1/60)return(deg*60).toFixed(deg*60>=10?1:2)+'′';
  return(deg*3600).toFixed(deg*3600>=10?1:2)+'″';
}

function pickStep(target){for(const s of GRID_STEPS)if(s<=target+1e-12)return s;return GRID_STEPS[GRID_STEPS.length-1];}

function parseCSV(text){

  for(let i=0;i<text.length;i++){

function initGaiaLocal(){
 if(gaiaLocal.attempted)return;
 gaiaLocal.attempted=true;
 fetch('./catalogs/gaia/manifest.json',{cache:'force-cache'}).then(async r=>{
   if(!r.ok)throw Error('Static Gaia manifest HTTP '+r.status);
   const d=await r.json();
   if(d.catalog!=='Gaia DR3'||!Array.isArray(d.fields))throw Error('Unexpected Gaia manifest');
   gaiaLocal.manifest=d;
   const picker=$('gaiaCacheTarget'),btn=$('gaiaCacheGo');
   if(picker){
     picker.replaceChildren();
     for(const field of d.fields){
       if(!field?.target_id||!field?.center)continue;
       const opt=document.createElement('option');
       opt.value=String(field.target_id);
       opt.textContent=String(field.name||field.target_id)+(field.truncated?' (partial)':'');
       picker.append(opt);
     }
     picker.disabled=!picker.options.length;
     if(btn)btn.disabled=picker.disabled;
   }
   catalogNotice();requestRender();
 }).catch(e=>{gaiaLocal.loadError=String(e.message||e);catalogNotice();});
}
function syncGaiaLocal(view){
 // Public Sky Atlas uses 0.2°–180° FOV. Static CSVs are 0.2°-radius cones,
 // so show verified sources in intersecting views (0.2°–12°) as partial data.
 if(!L.gaia||V.fov>12||manualGaia){
   if(gaiaLocal.stars.length||gaiaLocal.active){gaiaLocal.stars=[];gaiaLocal.active='';}
   return;
 }
 if(!gaiaLocal.manifest){initGaiaLocal();return;}
 const fields=gaiaLocal.manifest.fields;
 let chosen=null,best=Infinity;
 for(const f of fields){
   if(!f?.file||!f?.center)continue;
   const a=Number(f.center.ra_deg),d=Number(f.center.dec_deg),radius=Number(f.radius_deg);
   if(![a,d,radius].every(Number.isFinite)||radius<=0)continue;
   const dist=skySep(view.ra,view.dec,a*D2R,d*D2R);
   if(dist<radius+view.radius&&dist<best){best=dist;chosen=f;}
 }
 if(!chosen){if(gaiaLocal.stars.length||gaiaLocal.active){gaiaLocal.stars=[];gaiaLocal.active='';}return;}
 const id=String(chosen.target_id),current=gaiaLocal.files.get(id);
 gaiaLocal.active=id;
 if(current){if(gaiaLocal.stars!==current)gaiaLocal.stars=current;return;}
 gaiaLocal.stars=[];
 if(gaiaLocal.pending.has(id))return;
 gaiaLocal.pending.add(id);
 const file=String(chosen.file);
 if(!/^[a-z0-9-]+\.csv$/i.test(file)){gaiaLocal.pending.delete(id);return;}
 fetch('./catalogs/gaia/'+file,{cache:'force-cache'}).then(async r=>{
   if(!r.ok)throw Error(file+' HTTP '+r.status);
   const rows=parseCSV(await r.text());
   const data=normalizeGaia(rows).filter(star=>
     skySep(star.ra,star.dec,Number(chosen.center.ra_deg)*D2R,Number(chosen.center.dec_deg)*D2R)
      <=Number(chosen.radius_deg)+0.0002 &&
     star.mag<Number(chosen.mag_limit));
   if(!data.length)throw Error(file+': no valid Gaia DR3 coordinates');
   gaiaLocal.files.set(id,data);
   if(gaiaLocal.active===id&&!manualGaia){gaiaLocal.stars=data;catalogNotice();requestRender();}
 }).catch(e=>{
   gaiaLocal.loadError=String(e.message||e);
   if(gaiaLocal.active===id){catalogNotice();requestRender();}
 }).finally(()=>gaiaLocal.pending.delete(id));
}
/* Wide Gaia DR3 G<15.5 static fields are separate from narrow G<18.5
 * fields. Each download is a genuine 2.1-degree cone around a science
 * target; one field does NOT imply complete whole-sky Gaia coverage. */
function initGaiaWide(){
 if(gaiaWide.attempted)return;
 gaiaWide.attempted=true;
 fetch('./catalogs/gaia-wide/manifest.json',{cache:'force-cache'}).then(async r=>{
  if(!r.ok)throw Error('Wide Gaia manifest HTTP '+r.status);
  const m=await r.json();
  if(m.catalog!=='Gaia DR3'||!Array.isArray(m.fields))throw Error('Invalid Gaia-wide manifest');
  gaiaWide.manifest=m;
  catalogNotice();requestRender();
 }).catch(e=>{
  gaiaWide.loadError=String(e.message||e);
  catalogNotice();
 });
}
function syncGaiaWide(view){
 if(!L.gaia||V.fov>12||manualGaia){
   if(gaiaWide.stars.length||gaiaWide.active){gaiaWide.active='';gaiaWide.stars=[];}
   return;
 }
 if(!gaiaWide.manifest){initGaiaWide();return;}
 const fields=gaiaWide.manifest.fields;
 let selected=null,nearest=Infinity;
 for(const f of fields){
   if(!f?.center||!f?.file)continue;
   const ra=Number(f.center.ra_deg),dec=Number(f.center.dec_deg),radius=Number(f.radius_deg);
   if(![ra,dec,radius].every(Number.isFinite)||radius<=0)continue;
   const dist=skySep(view.ra,view.dec,ra*D2R,dec*D2R);
   if(dist<radius+view.radius&&dist<nearest){nearest=dist;selected=f;}
 }
 if(!selected){gaiaWide.active='';gaiaWide.stars=[];return;}
 const id=String(selected.target_id);
 gaiaWide.active=id;
 const present=gaiaWide.files.get(id);
 if(present){gaiaWide.stars=present;return;}
 gaiaWide.stars=[];
 if(gaiaWide.pending.has(id))return;
 const file=String(selected.file);
 if(!/^[a-z0-9-]+\.csv$/i.test(file))return;
 gaiaWide.pending.add(id);
 fetch('./catalogs/gaia-wide/'+file,{cache:'force-cache'}).then(async r=>{
  if(!r.ok)throw Error('Wide Gaia '+file+': HTTP '+r.status);
  const raw=parseCSV(await r.text());
  const data=normalizeGaia(raw).filter(o=>
    o.mag<=Number(selected.mag_limit)+0.001&&
    skySep(o.ra,o.dec,Number(selected.center.ra_deg)*D2R,
      Number(selected.center.dec_deg)*D2R)<=Number(selected.radius_deg)+0.0002);
  if(!data.length)throw Error('Empty Gaia-wide CSV: '+file);
  gaiaWide.files.set(id,data);
  if(gaiaWide.active===id&&!manualGaia){gaiaWide.stars=data;catalogNotice();requestRender();}
 }).catch(e=>{
  gaiaWide.loadError=String(e.message||e).slice(0,180);
  if(gaiaWide.active===id)catalogNotice();
 }).finally(()=>gaiaWide.pending.delete(id));
}
function updateGaiaWideStatus(){
 const el=$('gaiaWideStatus');if(!el)return;
 const zh=lang==='zh';
 if(!L.gaia){el.textContent=zh?'Gaia 圖層已關閉':'Gaia layer off';return;}
 if(gaiaWide.stars.length){
  const entry=gaiaWide.manifest?.fields?.find(x=>x.target_id===gaiaWide.active);
  el.textContent=(entry?.name||gaiaWide.active)+': '+gaiaWide.stars.length+
   (zh?' 筆擴大 Gaia 星表（半徑 2.1°、G<15.5；不代表全 FOV）':
        ' wide Gaia stars (2.1° radius, G<15.5; not whole FOV)')+
   (entry?.truncated?(zh?'；達筆數上限':' (truncated at row limit)'):'');
  return;
 }
 if(gaiaWide.loadError){el.textContent=(zh?'擴大 Gaia 星表尚不可用：':'Wide Gaia cache unavailable: ')+gaiaWide.loadError;return;}
 el.textContent=!gaiaWide.manifest
  ?(zh?'擴大 Gaia 星表清單載入中…':'Loading wide Gaia manifest…')
  :(zh?'五個研究目標有擴大 Gaia 星表；其他天區使用 HYG 全天底圖。':
    'Wide Gaia is available for five science fields; HYG covers other sky regions.');
}
function gaiaLocalCoversView(view){
  if(!gaiaLocal.stars.length||!gaiaLocal.manifest||!gaiaLocal.active)return false;
  const f=gaiaLocal.manifest.fields.find(x=>x.target_id===gaiaLocal.active);
  if(!f)return false;
  const dist=skySep(view.ra,view.dec,Number(f.center.ra_deg)*D2R,Number(f.center.dec_deg)*D2R);
  return dist+view.radius<=Number(f.radius_deg)*0.99
    &&view.mag<=Number(f.mag_limit)+0.001
    &&!f.truncated;
}
$('gaiaCacheGo').onclick=()=>{
 const id=$('gaiaCacheTarget').value;
 const f=gaiaLocal.manifest?.fields?.find(x=>x.target_id===id);
 if(!f)return;
 window.SkyAtlas?.goToCoordinates?.({
   ra_deg:Number(f.center.ra_deg),dec_deg:Number(f.center.dec_deg),fov_deg:2
 });
};
/* Error messages distinguish HTTP errors from blocked cross-origin fetches.
 * A generic TypeError cannot prove CORS; network/DNS and extensions can also
 * reject cross-origin requests. */
function gaiaErrorReason(error){
  if(error?.name==='AbortError')return 'timeout (20 s)';
  const msg=String(error?.message||error||'unknown error');
  if(error instanceof TypeError||/Failed to fetch|NetworkError|Load failed/i.test(msg))
    return 'browser network/CORS blocked or service unreachable';
  return msg.slice(0,130);
}
async function tapRequest(service,query){
  const q=new URLSearchParams({
    REQUEST:'doQuery',LANG:'ADQL',FORMAT:'csv',QUERY:query,MAXREC:String(GAIA_LIMIT)
  });
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),20000);
  try{
    const resp=await fetch(service.url+'?'+q.toString(),{
      signal:controller.signal,
      headers:{Accept:'text/csv, text/plain;q=0.9, */*;q=0.1'}
    });
    if(!resp.ok)throw Error('HTTP '+resp.status);
    const raw=await resp.text();
    if(/^\s*</.test(raw))throw Error('TAP returned XML/HTML (possibly a service query error)');
    const rows=parseCSV(raw);
    if(!rows.length)throw Error('Empty/invalid CSV');
    if(!('ra' in rows[0])||!('dec' in rows[0]))
      throw Error('Unexpected TAP columns: '+Object.keys(rows[0]).slice(0,5).join(', '));
    return rows;
  }finally{clearTimeout(timer);}
}
function gaiaADQL(view,table){
  const ra=view.ra*R2D,dec=view.dec*R2D;
  return `SELECT TOP ${GAIA_LIMIT} source_id, ra, dec, phot_g_mean_mag FROM ${table} WHERE 1=CONTAINS(POINT('ICRS',ra,dec),CIRCLE('ICRS',${ra.toFixed(7)},${dec.toFixed(7)},${view.radius.toFixed(6)})) AND phot_g_mean_mag < ${view.mag.toFixed(1)} ORDER BY phot_g_mean_mag ASC`;
}
async function loadGaia(view){
  const issues=[];
  for(const service of GAIA_TAP){
    try{
      const sql=gaiaADQL(view,service.table);
      const rows=await tapRequest(service,sql);
      return normalizeGaia(rows);
    }catch(e){
      issues.push(service.name+': '+gaiaErrorReason(e));
    }
  }
  throw Error(issues.join(' | ')||'Gaia TAP unavailable');
}
async function performGaiaQuery(){
  gaiaTimer=null;
  if(manualGaia||gaiaBusy||!L.gaia||V.fov>12||!V.W||!V.H)return;
  const view=gaiaView();
  const cache=gaiaCache.find(c=>isCovered(c,view.ra,view.dec,view.radius,view.mag));
  if(cache){gaiaStars=cache.stars;gaiaNotice=(lang==='zh'?'已載入 ':'loaded ')+gaiaStars.length+(lang==='zh'?' 筆':' stars');catalogNotice();requestRender();return;}
  if(isCovered(gaiaLastFailure,view.ra,view.dec,view.radius,view.mag))return;
  const requestEpoch=++gaiaQueryEpoch;
  gaiaBusy=true;gaiaFailureText='';catalogNotice();
  try{
    const stars=await loadGaia(view);
    if(requestEpoch!==gaiaQueryEpoch)return; // Older requests must not overwrite new view settings.
    gaiaCache.unshift({...view,stars});if(gaiaCache.length>4)gaiaCache.pop();
    // View may move while the request is pending: cache the answer but do
    // not paint a stale sky region over the current center or magnitude cut.
    const current=gaiaView();
    if(!isCovered(view,current.ra,current.dec,current.radius,current.mag)){gaiaStars=[];return;}
    gaiaStars=stars;gaiaNotice=(lang==='zh'?'已載入 ':'loaded ')+stars.length+(lang==='zh'?' 筆':' stars');
    gaiaLastFailure=null;
    if(stars.length>=GAIA_LIMIT)gaiaNotice+=(lang==='zh'?'（已達筆數上限）':' (row cap reached)');
  }catch(e){
    if(requestEpoch!==gaiaQueryEpoch)return;
    gaiaFailureText=String(e&&e.message||e).slice(0,380);
    gaiaLastFailure=view;
    gaiaStars=[];
  }finally{
    if(requestEpoch===gaiaQueryEpoch){gaiaBusy=false;catalogNotice();requestRender();}
  }
}
function scheduleGaia(){
  if(manualGaia){catalogNotice();return;}
  if(V.W&&V.H){
    const v=gaiaView();
    syncGaiaLocal(v);syncGaiaWide(v);
  }
  const currentView=gaiaView();
  if(L.gaia&&V.fov<=12&&(gaiaLocalCoversView(currentView)||
     (V.fov<=3&&gaiaWide.stars.length>0&&gaiaWide.active))){
    // A complete local catalog already covers this field and magnitude range.
    // Never force public browsers to make a cross-origin TAP request here.
    clearTimeout(gaiaTimer);gaiaTimer=null;
    if(gaiaBusy){gaiaQueryEpoch++;gaiaBusy=false;}
    gaiaFailureText='';gaiaLastFailure=null;gaiaStars=[];
    catalogNotice();updateGaiaWideStatus();
    return;
  }
  if(!L.gaia||V.fov>12||!V.W||!V.H){
    clearTimeout(gaiaTimer);gaiaTimer=null;
    if(V.fov>12)gaiaStars=[];
    catalogNotice();return;
  }
  const view=gaiaView();
  const cached=gaiaCache.find(c=>isCovered(c,view.ra,view.dec,view.radius,view.mag));
  if(cached){if(gaiaStars!==cached.stars){gaiaStars=cached.stars;catalogNotice();}return;}
  if(isCovered(gaiaLastFailure,view.ra,view.dec,view.radius,view.mag))return;
  if(gaiaBusy)return;
  clearTimeout(gaiaTimer);
  gaiaTimer=setTimeout(performGaiaQuery,850);
}
function normalizeSPHEREx(input){
  const raw=Array.isArray(input)?input:(Array.isArray(input?.sources)?input.sources:[]);
  return raw.map((o,i)=>{
    const ra=Number(o.ra_deg??o.ra),dec=Number(o.dec_deg??o.dec);
    if(!Number.isFinite(ra)||!Number.isFinite(dec)||dec < -90||dec>90)return null;
    const id=String(o.global_source_id||o.detection_id||o.candidate_id||o.source_id||'row_'+(i+1));
    return {...o,kind:'spx',ra:ra*D2R,dec:dec*D2R,n:id,source_id:id,quality_status:String(o.quality_status||'unknown')};
  }).filter(Boolean);
}
let spxCatalogTarget=null,spxCatalogOrigin='none';
function setSPHERExSources(input,opts={}){
  const rows=normalizeSPHEREx(input);
  const previousTarget=spxCatalogTarget;
  spherexSources=rows;
  spxCatalogTarget=typeof opts.target_id==='string'?opts.target_id:null;
  spxCatalogOrigin=opts.origin||'custom';
  const label=spxCatalogTarget?(' ['+spxCatalogTarget+']'):'';
  if(rows.length){
    spxNotice=(lang==='zh'?'已載入 ':'loaded ')+rows.length+
      (lang==='zh'?' 筆真實來源':' catalog sources')+label;
  }else{
    spxNotice=spxCatalogOrigin==='manifest'
      ?(lang==='zh'?'此目標尚無已驗證 Source Catalog':'No verified Source Catalog for selected target')
      :(lang==='zh'?'尚無來源資料':'no source catalog');
  }
  // Clear a stale source selection if it belonged to a different catalog.
  if(sel?.hit?.kind==='spx'){
    const active=rows.find(o=>o.source_id===sel.hit.o.source_id
      &&Math.abs(o.ra-sel.hit.o.ra)<1e-9&&Math.abs(o.dec-sel.hit.o.dec)<1e-9);
    if(!active||previousTarget!==spxCatalogTarget){sel=null;renderSel();}
  }
  catalogNotice();requestRender();
  return rows.length;
}
window.SPHERExCatalog={setSources:setSPHERExSources,
  getState:()=>({count:spherexSources.length,target_id:spxCatalogTarget,origin:spxCatalogOrigin}),
  clear:(opts={})=>setSPHERExSources([],{...opts,origin:opts.origin||'manifest'}),
  async loadFromUrl(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);
    const payload=String(url).toLowerCase().split('?')[0].endsWith('.csv')?parseCSV(await r.text()):await r.json();
    return setSPHERExSources(payload,{origin:'url'});
  }
};

function drawGaia(){
  if(!L.gaia||V.fov>12)return;
  const faint=gaiaMagLimit(V.fov);
  ctx.save();ctx.fillStyle='rgba(193,215,255,.80)';
  if(L.gaiaLabels&&V.fov<=2.5)ctx.font='10px '+getComputedStyle(document.body).getPropertyValue('--mono');
  let labels=0;
  for(const s of availableGaiaStars()){
    if(s.mag>faint||!project(s.ra,s.dec,P))continue;
    if(P.x<0||P.x>V.W||P.y<0||P.y>V.H)continue;
    const radius=clamp(0.55+(faint-s.mag)*0.12,0.55,2.6);
    ctx.globalAlpha=clamp(.30+(faint-s.mag)*.11,.3,.92);
    ctx.beginPath();ctx.arc(P.x,P.y,radius,0,TAU);ctx.fill();
    if(L.gaiaLabels&&V.fov<=2.5&&s.mag<=14&&labels<60){
      const label='G '+s.mag.toFixed(1),lx=P.x+radius+3,ly=P.y-3,w=ctx.measureText(label).width;
      if(freeSpot(lx,ly-9,w,12)){ctx.globalAlpha=.86;halo(label,lx,ly,'#abbfe0');labels++;}
    }
  }
  ctx.restore();
}
function drawSPHEREx(){
  if(!L.spx)return;
  ctx.save();ctx.lineWidth=1.4;
  if(L.spxLabels&&V.fov<=2.5)ctx.font='11px '+getComputedStyle(document.body).getPropertyValue('--mono');
  let labels=0;
  for(const s of spherexSources){
    if(L.spxPassOnly&&s.quality_status.toLowerCase()!=='pass')continue;
    if(!project(s.ra,s.dec,P)||P.x<-8||P.x>V.W+8||P.y<-8||P.y>V.H+8)continue;
    const pass=s.quality_status.toLowerCase()==='pass';
    ctx.strokeStyle=pass?'#57dfff':'#ffb347';
    ctx.setLineDash(pass?[]:[2,3]);
    ctx.beginPath();ctx.arc(P.x,P.y,4.5,0,TAU);ctx.stroke();ctx.setLineDash([]);
    if(L.spxLabels&&V.fov<=2.5&&labels<65){
      const label=String(s.source_id||s.n).slice(0,14),lx=P.x+7,ly=P.y-6,w=ctx.measureText(label).width;
      if(freeSpot(lx,ly-10,w,13)){halo(label,lx,ly,pass?'#78dff5':'#ffc688');labels++;}
    }
  }
  ctx.restore();
}

/* ---- sizing ---- */
function resize(){
  DPR=window.devicePixelRatio||1;
  const W=stage.clientWidth,H=stage.clientHeight;
  cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));
  setSize(W,H);requestRender();
}
new ResizeObserver(resize).observe(stage);

function requestRender(){if(dirty)return;dirty=true;requestAnimationFrame(render);}

/* ---- drawing ---- */
const P={x:0,y:0,k:1},Q={x:0,y:0,k:1};
function halo(text,x,y,color,align){
  ctx.textAlign=align||'left';ctx.lineWidth=3;ctx.strokeStyle='rgba(2,4,10,.85)';ctx.strokeText(text,x,y);
  ctx.fillStyle=color;ctx.fillText(text,x,y);
}
function drawMilkyWay(){
  if(!L.mw||V.fov<6)return;
  const fade=V.fov>=12?1:(V.fov-6)/6;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const rad=10*D2R;
  for(const m of MW){
    if(!project(m.ra,m.dec,P))continue;
    const r=V.S*P.k*rad;
    if(P.x<-r||P.x>V.W+r||P.y<-r||P.y>V.H+r)continue;
    if(r>5000)continue;
    ctx.globalAlpha=0.05*m.w*fade;
    ctx.drawImage(m.warm?SPR_WARM:SPR_COOL,P.x-r,P.y-r,2*r,2*r);
  }
  ctx.restore();
}
function drawGrid(){
  if(!L.grid)return;
  const fov=V.fov,step=pickStep(fov/5);
  const span=Math.min(fov,180),decC=V.dec*R2D,raC=V.ra*R2D;
  const dmin=Math.max(-90,decC-span),dmax=Math.min(90,decC+span);
  let raSpan=180;
  if(Math.abs(decC)+span<89){raSpan=Math.min(180,span/Math.max(Math.cos((Math.abs(decC)+span)*D2R),0.05));}
  const sampleDeg=Math.max(fov/25,1e-4);
  ctx.save();ctx.lineWidth=1;ctx.strokeStyle='rgba(112,142,196,.30)';
  const decLab=[],raLab=[];
  // meridians (constant RA)
  const r0=Math.ceil((raC-raSpan)/step-1e-9),r1=Math.floor((raC+raSpan)/step+1e-9);
  for(let i=r0;i<=r1;i++){
    if(r1-r0>400)break;
    const ra=i*step*D2R,n=clamp(Math.ceil((dmax-dmin)/sampleDeg)+1,2,220);
    ctx.beginPath();let pen=false,best=null,bd=1e9;
    for(let j=0;j<=n;j++){
      const d=(dmin+(dmax-dmin)*j/n)*D2R;
      if(!project(ra,d,P)){pen=false;continue;}
      if(pen)ctx.lineTo(P.x,P.y);else{ctx.moveTo(P.x,P.y);pen=true;}
      if(P.x>8&&P.x<V.W-8&&P.y>8&&P.y<V.H-8){const dd=Math.abs(P.y-(V.H-56));if(dd<bd){bd=dd;best={x:P.x,y:P.y};}}
    }
    ctx.stroke();
    if(best)raLab.push({x:best.x,y:best.y,t:labRA(i*step,step)});
  }
  // parallels (constant Dec)
  const d0=Math.ceil(dmin/step-1e-9),d1=Math.floor(dmax/step+1e-9);
  for(let i=d0;i<=d1;i++){
    const dec=i*step;if(Math.abs(dec)>=89.9999)continue;
    const cd=Math.max(Math.cos(dec*D2R),0.05);
    const n=clamp(Math.ceil(2*raSpan*cd/sampleDeg)+1,2,260);
    ctx.beginPath();let pen=false,best=null,bd=1e9;
    for(let j=0;j<=n;j++){
      const ra=(raC-raSpan+2*raSpan*j/n)*D2R;
      if(!project(ra,dec*D2R,P)){pen=false;continue;}
      if(pen)ctx.lineTo(P.x,P.y);else{ctx.moveTo(P.x,P.y);pen=true;}
      if(P.x>8&&P.x<V.W-8&&P.y>8&&P.y<V.H-8){const dd=Math.abs(P.x-70);if(dd<bd){bd=dd;best={x:P.x,y:P.y};}}
    }
    ctx.stroke();
    if(best)decLab.push({x:best.x,y:best.y,t:labDec(dec,step)});
  }
  // equator + poles hint
  ctx.restore();
  ctx.save();ctx.font='11px '+getComputedStyle(document.body).getPropertyValue('--mono');
  for(const l of decLab)halo(l.t,l.x+4,l.y-4,'rgba(130,170,235,.85)');
  for(const l of raLab)halo(l.t,l.x+4,l.y-4,'rgba(130,170,235,.85)');
  ctx.restore();
}
function drawEcliptic(){
  if(!L.ecl)return;
  const eps=23.4393*D2R;
  ctx.save();ctx.strokeStyle='rgba(255,205,110,.5)';ctx.lineWidth=1;ctx.setLineDash([6,5]);
  ctx.beginPath();let pen=false;
  for(let lam=0;lam<=360;lam+=1){
    const t=lam*D2R,ra=Math.atan2(Math.sin(t)*Math.cos(eps),Math.cos(t)),dec=Math.asin(Math.sin(t)*Math.sin(eps));
    if(!project(ra,dec,P)){pen=false;continue;}
    if(pen)ctx.lineTo(P.x,P.y);else{ctx.moveTo(P.x,P.y);pen=true;}
  }
  ctx.stroke();ctx.restore();
}
function drawConstellations(){
  if(L.cl){
    ctx.save();ctx.strokeStyle='rgba(118,164,236,.55)';ctx.lineWidth=1.1;ctx.beginPath();
    for(const c of CONS)for(const e of c.edges){
      if(!project(e[0].ra,e[0].dec,P)||!project(e[1].ra,e[1].dec,Q))continue;
      ctx.moveTo(P.x,P.y);ctx.lineTo(Q.x,Q.y);
    }
    ctx.stroke();ctx.restore();
  }
  if(L.cn&&V.fov<=140){
    ctx.save();ctx.font='500 13px '+getComputedStyle(document.body).getPropertyValue('--font');
    for(const c of CONS){
      if(!project(c.cra,c.cdec,P))continue;
      if(P.x<20||P.x>V.W-20||P.y<20||P.y>V.H-20)continue;
      halo(consName(c),P.x,P.y,'rgba(156,188,231,.74)','center');
    }
    ctx.restore();
  }
}
const placed=[];
function freeSpot(x,y,w,h){
  for(const r of placed)if(x<r.x+r.w&&x+w>r.x&&y<r.y+r.h&&y+h>r.y)return false;
  placed.push({x,y,w,h});return true;
}
function drawDSO(){
  if(!L.dso||V.fov>120)return;
  ctx.save();ctx.font='12px '+getComputedStyle(document.body).getPropertyValue('--font');ctx.lineWidth=1.2;
  for(const o of DSOS){
    if(!project(o.ra,o.dec,P))continue;
    const half=Math.max(5,V.S*P.k*(o.size/60)*D2R/2);
    if(P.x<-half||P.x>V.W+half||P.y<-half||P.y>V.H+half)continue;
    if(V.fov>40&&o.size<20&&o.mag>6)continue;
    const col=DSO_COL[o.t];ctx.strokeStyle=col;ctx.setLineDash([]);ctx.globalAlpha=.9;
    ctx.beginPath();
    if(o.t==='gal'){ctx.ellipse(P.x,P.y,half,half*.55,-.5,0,TAU);}
    else if(o.t==='neb'){ctx.rect(P.x-half,P.y-half,2*half,2*half);}
    else if(o.t==='oc'){ctx.setLineDash([3,3]);ctx.arc(P.x,P.y,half,0,TAU);}
    else if(o.t==='gc'){ctx.arc(P.x,P.y,half,0,TAU);ctx.moveTo(P.x-half,P.y);ctx.lineTo(P.x+half,P.y);ctx.moveTo(P.x,P.y-half);ctx.lineTo(P.x,P.y+half);}
    else{ctx.arc(P.x,P.y,6,0,TAU);ctx.moveTo(P.x-11,P.y);ctx.lineTo(P.x+11,P.y);ctx.moveTo(P.x,P.y-11);ctx.lineTo(P.x,P.y+11);}
    ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    const nm=dsoName(o),w=ctx.measureText(nm).width,lx=P.x+half+4,ly=P.y+4;
    if(freeSpot(lx,ly-11,w,14))halo(nm,lx,ly,col);
  }
  ctx.restore();
}
function drawStars(){
  const zf=clamp(1+0.3*Math.log10(90/V.fov),0.8,2.6);
  const lim=V.fov>90?1.3:V.fov>40?2.0:V.fov>15?2.8:V.fov>5?3.6:99;
  ctx.save();ctx.font='12px '+getComputedStyle(document.body).getPropertyValue('--font');
  for(const s of STARS){
    if(!project(s.ra,s.dec,P))continue;
    if(P.x<-30||P.x>V.W+30||P.y<-30||P.y>V.H+30)continue;
    const r=Math.min(9,Math.max(0.7,(4.4-s.mag)*0.62+0.9)*zf);
    const col=TINT[s.k]||'#ffffff';
    if(s.mag<3){
      const g=ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,r*4);
      g.addColorStop(0,'rgba(190,210,255,.30)');g.addColorStop(1,'rgba(190,210,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(P.x,P.y,r*4,0,TAU);ctx.fill();
    }
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(P.x,P.y,r,0,TAU);ctx.fill();
    if(L.sn&&s.mag<=lim){
      const w=ctx.measureText(s.n).width,lx=P.x+r+4,ly=P.y+4;
      if(freeSpot(lx,ly-11,w,14))halo(s.n,lx,ly,'rgba(205,218,240,.82)');
    }
  }
  ctx.restore();
}
function drawSelection(){
  if(!sel||!project(sel.ra,sel.dec,P))return;
  const x=P.x,y=P.y,a=getComputedStyle(document.body).getPropertyValue('--accent').trim()||'#ffb347';

  ctx.moveTo(x,y-20);ctx.lineTo(x,y-14);ctx.moveTo(x,y+14);ctx.lineTo(x,y+20);ctx.stroke();
  ctx.font='500 12px '+getComputedStyle(document.body).getPropertyValue('--mono');

}
function drawReticle(){
  if(!L.ret)return;
  ctx.save();ctx.strokeStyle='rgba(220,230,250,.35)';ctx.lineWidth=1;ctx.beginPath();
  ctx.moveTo(V.cx-9,V.cy);ctx.lineTo(V.cx+9,V.cy);ctx.moveTo(V.cx,V.cy-9);ctx.lineTo(V.cx,V.cy+9);ctx.stroke();ctx.restore();
}
function render(){
  dirty=false;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(V.cx,V.cy,0,V.cx,V.cy,Math.hypot(V.W,V.H)/2);
  g.addColorStop(0,'#0b1429');g.addColorStop(1,'#02030a');
  ctx.fillStyle=g;ctx.fillRect(0,0,V.W,V.H);
  placed.length=0;
  if(allSkyLayer){
    const aspect=Math.max(V.W,V.H)/Math.max(1,Math.min(V.W,V.H));
    allSkyLayer.sync({ra:V.ra,dec:V.dec,fov:L.hyg?V.fov:180,aspect});
  }
  drawMilkyWay();drawGrid();drawEcliptic();drawConstellations();drawDSO();
  if(L.hyg)allSkyLayer?.draw(ctx,V,project,P,TAU,clamp);
  drawGaia();drawStars();drawSPHEREx();drawSelection();drawReticle();

  if(status){
    const next=allSkyLayer?.statusText(lang==='zh')||(lang==='zh'?'HYG 全天星表載入中…':'Loading HYG all-sky stars…');
    if(status.textContent!==next)status.textContent=next;

}

/* ---- selection ---- */
function nearestObject(ra,dec,px,py){
  let best=null,bd=16;
  if(L.spx)for(const s of spherexSources){
    if(L.spxPassOnly&&s.quality_status.toLowerCase()!=='pass')continue;
    if(!project(s.ra,s.dec,P))continue;
    const d=Math.hypot(P.x-px,P.y-py);
    if(d<bd){bd=d;best={kind:'spx',o:s};}
  }
  // A directly clicked SPHEREx measurement must not be masked by a large DSO icon.
  if(best&&best.kind==='spx'&&bd<=10)return best;
  if(L.gaia&&V.fov<=12)for(const s of availableGaiaStars()){
    if(s.mag>gaiaMagLimit(V.fov)||!project(s.ra,s.dec,P))continue;
    const d=Math.hypot(P.x-px,P.y-py);
    if(d<bd){bd=d;best={kind:'gaia',o:s};}
  }
  if(best&&best.kind==='gaia'&&bd<=7)return best;
  if(L.hyg&&allSkyLayer){
    const match=allSkyLayer.nearest(px,py,bd,project,P,V);
    if(match&&match.distance<bd){bd=match.distance;best={kind:'hyg',o:match.o};}
  }
  for(const s of STARS){if(!project(s.ra,s.dec,P))continue;const d=Math.hypot(P.x-px,P.y-py);if(d<bd){bd=d;best={kind:'star',o:s};}}
  if(L.dso&&V.fov<=120)for(const o of DSOS){if(!project(o.ra,o.dec,P))continue;const half=Math.max(5,V.S*P.k*(o.size/60)*D2R/2);const d=Math.max(0,Math.hypot(P.x-px,P.y-py)-Math.min(half,40));if(d<bd){bd=d;best={kind:'dso',o:o};}}
  return best;
}

function fillInputs(ra,dec){

function select(ra,dec,px,py){

  sel={ra,dec,hit};fillInputs(ra,dec);renderSel();requestRender();

/* ---- animation ---- */
function cancelAnim(){if(anim){cancelAnimationFrame(anim);anim=null;}}
function flyTo(ra,dec,fov){
  cancelAnim();
  if(reduceMotion){setView(ra,dec,fov);requestRender();return;}
  const s={ra:V.ra,dec:V.dec,lf:Math.log(V.fov)};
  const dRa=angDiff(ra,s.ra),dDec=dec-s.dec,dLf=Math.log(clamp(fov,0.2,180))-s.lf;
  const t0=performance.now(),dur=750;
  const step=now=>{
    const t=Math.min(1,(now-t0)/dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    setView(s.ra+dRa*e,s.dec+dDec*e,Math.exp(s.lf+dLf*e));render();
    anim=t<1?requestAnimationFrame(step):null;
    if(t>=1&&sel)renderSel();
  };
  anim=requestAnimationFrame(step);
}

/* ---- pointer / wheel / keys ---- */
const pts=new Map();let drag=null,pinch=null;
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{
  cancelAnim();cv.setPointerCapture(e.pointerId);
  const p=pos(e);pts.set(e.pointerId,p);
  if(pts.size===1){drag={start:p,moved:false,anchor:unproject(p.x,p.y)};}
  else if(pts.size===2){
    const[a,b]=[...pts.values()];
    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,fov0:V.fov,anchor:unproject((a.x+b.x)/2,(a.y+b.y)/2)};
    if(drag)drag.moved=true;
  }
});
cv.addEventListener('pointermove',e=>{
  const p=pos(e);
  if(pts.has(e.pointerId))pts.set(e.pointerId,p);
  if(pinch&&pts.size>=2){
    const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    setView(V.ra,V.dec,pinch.fov0*pinch.d0/Math.max(d,1));
    anchorTo(pinch.anchor,(a.x+b.x)/2,(a.y+b.y)/2);requestRender();return;
  }
  if(drag&&pts.size===1){
    if(!drag.moved&&Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>4){drag.moved=true;cv.classList.add('grabbing');}
    if(drag.moved){anchorTo(drag.anchor,p.x,p.y);requestRender();}
  }
  if(e.pointerType==='mouse')hover(p.x,p.y);
});
function endPointer(e,allowSelect){
  const p=pos(e);
  if(allowSelect&&drag&&!drag.moved&&pts.size===1){const s=unproject(p.x,p.y);select(s.ra,s.dec,p.x,p.y);}
  pts.delete(e.pointerId);
  if(pts.size<2)pinch=null;
  if(pts.size===0){drag=null;cv.classList.remove('grabbing');}
  else if(pts.size===1&&!drag){/* remaining finger after pinch does nothing */}
}
cv.addEventListener('pointerup',e=>endPointer(e,true));
cv.addEventListener('pointercancel',e=>endPointer(e,false));
cv.addEventListener('wheel',e=>{
  e.preventDefault();cancelAnim();
  const p=pos(e),dy=e.deltaY*(e.deltaMode===1?16:1),sky=unproject(p.x,p.y);
  setView(V.ra,V.dec,V.fov*Math.exp(clamp(dy,-300,300)*0.0014));
  anchorTo(sky,p.x,p.y);requestRender();hover(p.x,p.y);
},{passive:false});
cv.addEventListener('dblclick',e=>{
  const p=pos(e),s=unproject(p.x,p.y);flyTo(s.ra,s.dec,V.fov/2.5);
});
function zoomBy(f){cancelAnim();setView(V.ra,V.dec,V.fov*f);requestRender();}
$('zin').onclick=()=>zoomBy(1/1.6);
$('zout').onclick=()=>zoomBy(1.6);
window.addEventListener('keydown',e=>{
  const t=e.target&&e.target.tagName;
  if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey)return;
  const st=V.fov*D2R*0.12;let h=true;
  if(e.key==='ArrowLeft')setView(V.ra+st/Math.max(V.cd,0.05),V.dec,V.fov);
  else if(e.key==='ArrowRight')setView(V.ra-st/Math.max(V.cd,0.05),V.dec,V.fov);
  else if(e.key==='ArrowUp')setView(V.ra,V.dec+st,V.fov);
  else if(e.key==='ArrowDown')setView(V.ra,V.dec-st,V.fov);
  else if(e.key==='+'||e.key==='=')setView(V.ra,V.dec,V.fov/1.3);
  else if(e.key==='-'||e.key==='_')setView(V.ra,V.dec,V.fov*1.3);
  else h=false;
  if(h){e.preventDefault();cancelAnim();requestRender();}
});

  b.onclick=()=>{
    const ra=rah*15*D2R,de=dec*D2R;
    if(zh!=='全天'){sel={ra,dec:de,hit:null};fillInputs(ra,de);renderSel();}
    flyTo(ra,de,fov);
  };
  chips.appendChild(b);presetBtns.push([b,zh,en]);
});
const lay=$('layers');
const layerTxt={};
Object.keys(L).forEach(k=>{
  const lb=document.createElement('label'),cb=document.createElement('input'),tx=document.createTextNode('');
  cb.type='checkbox';cb.checked=L[k];cb.id='ly-'+k;

/* ---- language ---- */
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.title=tr('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n);});

  $('lang').textContent=lang==='zh'?'EN':'中文';

  Object.keys(layerTxt).forEach(k=>{layerTxt[k].nodeValue=tr('layerNames')[k];});

  $('catnote').textContent=tr('catnote')(STARS.length,DSOS.length);
  catalogNotice();
  say(lastMsg.k,lastMsg.err,lastMsg.a);

/* Public bridge: clicking science-image markers focuses the matching sky position.
   Uses RA/Dec, never assumes detector or image pixels equal sky canvas pixels. */
/* Offline search only: named objects from the built-in real-star/DSO catalogs,
 * constellation centroids, presets, and science targets in the notebook UI.
 * An arbitrary search result is a sky position, not a SPHEREx detection. */
function skyObjectSearch(query,maxResults=15){
 const cleaned=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\s\u2019'._-]+/g,'');
 const q=cleaned(query).trim();
 if(q.length<2)return[];
 const candidates=[];
 const offer=(kind,id,label,aliases,ra,dec,fov,mag)=>{
  const strings=[label,...aliases].map(cleaned);
  const exact=strings.some(x=>x===q),prefix=strings.some(x=>x.startsWith(q)),part=strings.some(x=>x.includes(q));
  if(!part)return;
  candidates.push({kind,id:String(id),label,ra_deg:ra*R2D,dec_deg:dec*R2D,fov_deg:fov,
    ...(Number.isFinite(mag)?{mag}:{}),rank:exact?0:prefix?1:2});
 };
 for(const s of STARS)offer('star',s.k,s.n,[],s.ra,s.dec,Math.min(V.fov,4),s.mag);
 if(L.hyg&&allSkyLayer)for(const found of allSkyLayer.search(query,15))candidates.push(found);
 for(const o of DSOS)offer('dso',o.id,dsoName(o),[o.id,o.n,EN_DSO[o.id]||''],o.ra,o.dec,Math.max(.35,Math.min(10,o.size/60*3)),o.mag);
 for(const [idx,p] of PRESETS.entries())offer('preset',idx,lang==='zh'?p[0]:p[1],[p[0],p[1]],p[2]*15*D2R,p[3]*D2R,p[4]);
 for(const c of CONS)offer('constellation',c.zh,consName(c),[c.zh,EN_CONS[c.zh]||''],c.cra,c.cdec,30);
 for(const g of availableGaiaStars()){
  if(g.source_id)offer('gaia',g.source_id,'Gaia DR3 '+g.source_id,[g.source_id],g.ra,g.dec,Math.min(V.fov,.3),g.mag);
 }
 for(const o of spherexSources)offer('spx',o.source_id,'SPHEREx '+o.source_id,[o.source_id],o.ra,o.dec,Math.min(V.fov,.3));
 const targets=window.SPHERExNotebookResults?.targets||[];
 for(const t of targets){
  const a=Number(t.ra_deg),d=Number(t.dec_deg);
  if(Number.isFinite(a)&&Number.isFinite(d)){
    const aliases=t.id==='Barnards_Star'?['GJ 699',"Barnard's Star"]:t.id==='WISE_0855'?['WISE 0855']:[];
    offer('target',t.id,t.name,[t.id,...aliases],a*D2R,d*D2R,Math.min(V.fov,.5));
  }
 }
 const limit=clamp(Number(maxResults)||15,1,40);
 return candidates.sort((a,b)=>a.rank-b.rank||(a.mag??99)-(b.mag??99)||a.label.localeCompare(b.label))
   .slice(0,limit).map(({rank,...item})=>item);
}
function focusSkyObject(result){
 if(!result||typeof result!=='object')return false;
 const kind=String(result.kind),id=String(result.id);
 let o=null,hit=null,ra=null,dec=null,fov=4;
 if(kind==='star'){o=STARS.find(v=>v.k===id);hit=o?{kind:'star',o}:null;}
 else if(kind==='hyg'){o=allSkyLayer?.findById(id);hit=o?{kind:'hyg',o}:null;}
 else if(kind==='dso'){o=DSOS.find(v=>v.id===id);hit=o?{kind:'dso',o}:null;}
 else if(kind==='gaia'){o=availableGaiaStars().find(v=>v.source_id===id);hit=o?{kind:'gaia',o}:null;}
 else if(kind==='spx'){o=spherexSources.find(v=>v.source_id===id);hit=o?{kind:'spx',o}:null;}
 else if(kind==='constellation'){o=CONS.find(v=>v.zh===id);}
 else if(kind==='preset'){const p=PRESETS[Number(id)];if(p)o={ra:p[2]*15*D2R,dec:p[3]*D2R};}
 else if(kind==='target'){
  const t=window.SPHERExNotebookResults?.targets?.find(v=>v.id===id);
  if(t)o={ra:Number(t.ra_deg)*D2R,dec:Number(t.dec_deg)*D2R};
 }
 if(!o)return false;
 ra=o.ra??o.cra;dec=o.dec??o.cdec;
 fov=Number(result.fov_deg);
 if(!Number.isFinite(ra)||!Number.isFinite(dec)||!Number.isFinite(fov))return false;
 fov=clamp(fov,0.2,180);
 sel={ra,dec,hit};fillInputs(ra,dec);renderSel();
 flyTo(ra,dec,fov);requestRender();
 if(hit?.kind==='spx')window.dispatchEvent(new CustomEvent('spherex:select-source',{detail:{source:o}}));
 return true;
}
function setGaiaDepth(mode){
 if(!['auto','bright','deep'].includes(mode))return false;
 if(gaiaDepth===mode)return true;
 gaiaDepth=mode;gaiaQueryEpoch++;gaiaBusy=false;clearTimeout(gaiaTimer);
 gaiaTimer=null;gaiaStars=manualGaia?gaiaStars:[];gaiaLastFailure=null;gaiaFailureText='';
 catalogNotice();requestRender();
 return true;
}
window.SkyAtlas={
  registerAllSkyLayer(layer){allSkyLayer=layer;requestRender();},
  requestRedraw:requestRender,
  getAllSkyCatalogStatus:()=>allSkyLayer?.status()||{ready:false,error:'not initialized'},
  searchObjects:skyObjectSearch,focusObject:focusSkyObject,setGaiaDepth,getGaiaDepth:()=>gaiaDepth,
  getGaiaCatalogStatus:()=>({
    online_count:gaiaStars.length,static_count:gaiaLocal.stars.length,
    wide_count:gaiaWide.stars.length,wide_target:gaiaWide.active,
    wide_manifest_loaded:!!gaiaWide.manifest,wide_error:gaiaWide.loadError,
    static_target:gaiaLocal.active,loaded_fields:gaiaLocal.files.size,
    static_manifest_loaded:!!gaiaLocal.manifest,static_error:gaiaLocal.loadError,
    online_error:gaiaFailureText
  }),
  // Move to a named/offline target or an explicit RA/Dec coordinate.
  // Do not interpret an arbitrary sky position as an actual SPHEREx detection.
  goToCoordinates({ra_deg,dec_deg,fov_deg}={}){
    const ra=Number(ra_deg),dec=Number(dec_deg),fov=Number(fov_deg);
    if(!Number.isFinite(ra)||ra<0||ra>=360||!Number.isFinite(dec)||dec< -90||dec>90)return false;
    const actualFov=Number.isFinite(fov)&&fov>0?clamp(fov,0.2,180):V.fov;
    $('unit').value='1';$('fov').value=String(actualFov);
    sel={ra:ra*D2R,dec:dec*D2R,hit:null};fillInputs(sel.ra,sel.dec);renderSel();
    flyTo(sel.ra,sel.dec,actualFov);requestRender();return true;
  },
  focusSource(source){
    const item=normalizeSPHEREx([source])[0];if(!item)return false;
    const hit=spherexSources.find(x=>x.source_id===item.source_id)||item;
    sel={ra:hit.ra,dec:hit.dec,hit:{kind:'spx',o:hit}};
    fillInputs(hit.ra,hit.dec);renderSel();
    flyTo(hit.ra,hit.dec,Math.min(V.fov,1.5));requestRender();
    return true;
  },
  getView(){return{ra_deg:V.ra*R2D,dec_deg:V.dec*R2D,fov_deg:V.fov};}
};

$('allSkyRetry').onclick=()=>{
  if(!allSkyLayer?.retryFailedTiles)return;
  allSkyLayer.retryFailedTiles();requestRender();
};

initGaiaWide(); // Separate real 2.1-degree DR3 field previews when available.
