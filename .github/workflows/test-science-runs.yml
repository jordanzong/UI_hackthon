name: Validate Science Analysis Run Exporter

on:
  workflow_dispatch:
  push:
    branches:
      - feature/science-analysis-runs
    paths:
      - 'tools/build_science_run_manifests.py'
      - 'tools/test_science_run_exporter.py'
      - '.github/workflows/test-science-runs.yml'

permissions:
  contents: read

jobs:
  validate-exporter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile tools/build_science_run_manifests.py tools/test_science_run_exporter.py
      - name: Run isolated synthetic-fixture tests (no scientific data is published)
        run: python3 tools/test_science_run_exporter.py
      - name: Validate front-end JavaScript syntax
        run: |
          node --check science-run-browser.js
          node --check notebook-results.js
