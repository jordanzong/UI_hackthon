name: Build Gaia DR3 Offline Catalogs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gaia-static-catalogs
    paths:
      - '.github/workflows/build-gaia-csv.yml'
      - 'tools/fetch_gaia_dr3_fields.py'

permissions:
  contents: write

jobs:
  download-verified-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout science UI branch
        uses: actions/checkout@v4
        with:
          ref: feature/gaia-static-catalogs
          persist-credentials: true

      - name: Download and validate Gaia DR3 via independent TAP providers
        id: export
        continue-on-error: true
        run: python3 tools/fetch_gaia_dr3_fields.py

      - name: Commit only real downloaded and validated source tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogs/gaia
          if ! git diff --cached --quiet; then
            git commit -m "data(gaia): cache validated DR3 source CSV fields"
            git push
          else
            echo "No verified Gaia CSV files changed"
          fi

      - name: Mark partial catalogs as incomplete
        if: steps.export.outcome != 'success'
        run: |
          echo "One or more field downloads failed. Check logs and rerun when providers recover."
          exit 1
